[package]
name = "zedplus"
version = "0.9.0"
edition = "2021"
description = "Smart AI routing CLI with realtime code indexing and response distillation"
license = "MIT"

[[bin]]
name = "zedplus"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# HTTP + streaming (rustls — no OpenSSL, clean Windows builds)
reqwest = { version = "0.12", features = ["stream", "rustls-tls", "json"], default-features = false }
tokio-stream = "0.1"
futures = "0.3"

# Database
rusqlite = { version = "0.31", features = ["bundled"] }

# Platform
dirs = "5"
keyring = "2"
sysinfo = "0.30"
open = "5"

# Time and locale
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.9"

# TUI / terminal
crossterm = "0.27"
inquire = "0.7"

# File watching
notify = "6"

# Tree-sitter + language grammars (versions resolved by Cargo)
tree-sitter = "*"
tree-sitter-rust = "*"
tree-sitter-javascript = "*"
tree-sitter-typescript = "*"
tree-sitter-python = "*"
tree-sitter-go = "*"

# Git
git2 = { version = "0.18", default-features = false }

# Async trait support
async-trait = "0.1"

# Error handling + logging
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

zip = { version = "0.6", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
