name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Windows ──────────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-x86_64-${{ hashFiles('Cargo.lock') }}

      - name: Build
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Package zip
        shell: pwsh
        run: |
          $ver = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\x86_64-pc-windows-msvc\release\zedplus.exe dist\zedplus.exe
          Copy-Item install.ps1 dist\install.ps1
          Compress-Archive -Path dist\* -DestinationPath "zedplus-$ver-windows-x86_64.zip"
          Write-Output "ZEDPLUS_VERSION=$ver" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: zedplus-*-windows-x86_64.zip

  # ── macOS (Apple Silicon) ─────────────────────────────────────────────────────
  build-macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-arm64-${{ hashFiles('Cargo.lock') }}

      - name: Build
        run: cargo build --release --target aarch64-apple-darwin

      - name: Create DMG
        run: |
          VER=$(cargo metadata --no-deps --format-version 1 | python3 -c "import sys,json; print(json.load(sys.stdin)['packages'][0]['version'])")
          mkdir -p staging
          cp target/aarch64-apple-darwin/release/zedplus staging/zedplus
          cp install.sh staging/install.sh || true
          chmod +x staging/zedplus
          hdiutil create \
            -volname "ZedPlus $VER" \
            -srcfolder staging \
            -ov -format UDZO \
            "zedplus-${VER}-macos-arm64.dmg"
          echo "ZEDPLUS_VERSION=$VER" >> "$GITHUB_ENV"

      - name: Create tar.gz
        run: |
          VER=$(cargo metadata --no-deps --format-version 1 | python3 -c "import sys,json; print(json.load(sys.stdin)['packages'][0]['version'])")
          tar -czf "zedplus-${VER}-macos-arm64.tar.gz" -C staging zedplus

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: |
            zedplus-*-macos-arm64.dmg
            zedplus-*-macos-arm64.tar.gz

  # ── macOS (Intel) ────────────────────────────────────────────────────────────
  build-macos-x86_64:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-x86_64-${{ hashFiles('Cargo.lock') }}

      - name: Build
        run: cargo build --release --target x86_64-apple-darwin

      - name: Create DMG
        run: |
          VER=$(cargo metadata --no-deps --format-version 1 | python3 -c "import sys,json; print(json.load(sys.stdin)['packages'][0]['version'])")
          mkdir -p staging
          cp target/x86_64-apple-darwin/release/zedplus staging/zedplus
          cp install.sh staging/install.sh || true
          chmod +x staging/zedplus
          hdiutil create \
            -volname "ZedPlus $VER" \
            -srcfolder staging \
            -ov -format UDZO \
            "zedplus-${VER}-macos-x86_64.dmg"

      - name: Create tar.gz
        run: |
          VER=$(cargo metadata --no-deps --format-version 1 | python3 -c "import sys,json; print(json.load(sys.stdin)['packages'][0]['version'])")
          tar -czf "zedplus-${VER}-macos-x86_64.tar.gz" -C staging zedplus

      - uses: actions/upload-artifact@v4
        with:
          name: macos-x86_64
          path: |
            zedplus-*-macos-x86_64.dmg
            zedplus-*-macos-x86_64.tar.gz

  # ── Linux x86_64 ─────────────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-x86_64-${{ hashFiles('Cargo.lock') }}

      - name: Build
        run: cargo build --release

      - name: Package tar.gz
        run: |
          VER=$(cargo metadata --no-deps --format-version 1 | python3 -c "import sys,json; print(json.load(sys.stdin)['packages'][0]['version'])")
          mkdir -p staging
          cp target/release/zedplus staging/zedplus
          cp install.sh staging/install.sh || true
          chmod +x staging/zedplus
          tar -czf "zedplus-${VER}-linux-x86_64.tar.gz" -C staging .

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: zedplus-*-linux-x86_64.tar.gz

  # ── GitHub Release (tag-triggered only) ──────────────────────────────────────
  release:
    needs: [build-windows, build-macos-arm64, build-macos-x86_64, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | sort

      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            artifacts/windows-x86_64/*.zip
            artifacts/macos-arm64/*.dmg
            artifacts/macos-arm64/*.tar.gz
            artifacts/macos-x86_64/*.dmg
            artifacts/macos-x86_64/*.tar.gz
            artifacts/linux-x86_64/*.tar.gz
